# ═══════════════════════════════════════════════════════════════════════════
# Filoshi — Cross-Platform Binary Builder (Fixed)
# Builds Ghostscript and ImageMagick for macOS (Intel & ARM) and Linux
# ═══════════════════════════════════════════════════════════════════════════

name: Build Cross-Platform Binaries

on:
  workflow_dispatch:  # Manual trigger only

env:
  GHOSTSCRIPT_VERSION: "10.04.0"
  IMAGEMAGICK_VERSION: "7.1.2-15"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # macOS Intel (x86_64) Build - Using macos-12 (more stable)
  # ═══════════════════════════════════════════════════════════════════════════
  build-macos-intel:
    runs-on: macos-12  # Intel runner (stable)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install autoconf automake libtool pkg-config

      - name: Download and Build Ghostscript
        run: |
          cd /tmp
          curl -L "https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10040/ghostscript-${GHOSTSCRIPT_VERSION}.tar.gz" -o gs.tar.gz
          tar -xzf gs.tar.gz
          cd ghostscript-${GHOSTSCRIPT_VERSION}
          ./configure --prefix=/tmp/install --disable-cups --disable-gtk --without-x --disable-shared --enable-static
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Rename binary
        run: |
          cp /tmp/install/bin/gs gs-x86_64-apple-darwin
          chmod +x gs-x86_64-apple-darwin

      - name: Upload Ghostscript Intel
        uses: actions/upload-artifact@v4
        with:
          name: gs-x86_64-apple-darwin
          path: gs-x86_64-apple-darwin

  # ═══════════════════════════════════════════════════════════════════════════
  # macOS ARM (Apple Silicon) Build
  # ═══════════════════════════════════════════════════════════════════════════
  build-macos-arm:
    runs-on: macos-14  # M1/M2 runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install autoconf automake libtool pkg-config

      - name: Download and Build Ghostscript
        run: |
          cd /tmp
          curl -L "https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10040/ghostscript-${GHOSTSCRIPT_VERSION}.tar.gz" -o gs.tar.gz
          tar -xzf gs.tar.gz
          cd ghostscript-${GHOSTSCRIPT_VERSION}
          ./configure --prefix=/tmp/install --disable-cups --disable-gtk --without-x --disable-shared --enable-static
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Rename binary
        run: |
          cp /tmp/install/bin/gs gs-aarch64-apple-darwin
          chmod +x gs-aarch64-apple-darwin

      - name: Upload Ghostscript ARM
        uses: actions/upload-artifact@v4
        with:
          name: gs-aarch64-apple-darwin
          path: gs-aarch64-apple-darwin

  # ═══════════════════════════════════════════════════════════════════════════
  # Linux (x86_64) Build
  # ═══════════════════════════════════════════════════════════════════════════
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config \
            libtiff-dev libjpeg-dev libpng-dev libfreetype6-dev liblcms2-dev \
            libopenjp2-7-dev libxml2-dev zlib1g-dev

      - name: Download and Build Ghostscript
        run: |
          cd /tmp
          curl -L "https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10040/ghostscript-${GHOSTSCRIPT_VERSION}.tar.gz" -o gs.tar.gz
          tar -xzf gs.tar.gz
          cd ghostscript-${GHOSTSCRIPT_VERSION}
          ./configure --prefix=/tmp/install --disable-cups --disable-gtk --without-x --disable-shared --enable-static
          make -j$(nproc)
          make install

      - name: Rename Ghostscript binary
        run: |
          cp /tmp/install/bin/gs gs-x86_64-unknown-linux-gnu
          chmod +x gs-x86_64-unknown-linux-gnu

      - name: Download and Build ImageMagick
        run: |
          cd /tmp
          IMAGEMAGICK_VER="7.1.2-15"
          curl -L "https://imagemagick.org/archive/releases/ImageMagick-${IMAGEMAGICK_VER}.tar.gz" -o im.tar.gz
          tar -xzf im.tar.gz
          cd ImageMagick-${IMAGEMAGICK_VER}
          ./configure --prefix=/tmp/im-install \
            --disable-shared --enable-static \
            --without-x --without-perl --without-magick-plus-plus \
            --without-fftw --without-flif --without-fpx --without-djvu \
            --without-raqm --without-wmf --without-gvc --without-openexr \
            --without-heic --without-jbig --without-lqr --without-lzma
          make -j$(nproc)
          make install

      - name: Rename ImageMagick binary
        run: |
          cp /tmp/im-install/bin/magick magick-x86_64-unknown-linux-gnu
          chmod +x magick-x86_64-unknown-linux-gnu

      - name: Upload Linux Binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            gs-x86_64-unknown-linux-gnu
            magick-x86_64-unknown-linux-gnu

  # ═══════════════════════════════════════════════════════════════════════════
  # Create Release with All Binaries
  # ═══════════════════════════════════════════════════════════════════════════
  release:
    needs: [build-macos-intel, build-macos-arm, build-linux]
    runs-on: ubuntu-latest
    if: always() && (needs.build-macos-intel.result == 'success' || needs.build-macos-arm.result == 'success' || needs.build-linux.result == 'success')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./binaries
          merge-multiple: true

      - name: List downloaded binaries
        run: |
          echo "=== Downloaded Binaries ==="
          ls -la ./binaries/
          file ./binaries/* || true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./binaries/*
          tag_name: binaries-${{ github.run_number }}
          name: "Filoshi Cross-Platform Binaries #${{ github.run_number }}"
          body: |
            Cross-platform binaries for Filoshi desktop app
            
            ## Included Binaries:
            - **Ghostscript 10.04.0** for macOS (Intel & ARM) and Linux
            - **ImageMagick 7.1.2-15** for Linux
            
            ## File Naming (no extensions):
            - `gs-x86_64-apple-darwin` - Ghostscript for macOS Intel
            - `gs-aarch64-apple-darwin` - Ghostscript for macOS ARM (Apple Silicon)
            - `gs-x86_64-unknown-linux-gnu` - Ghostscript for Linux
            - `magick-x86_64-unknown-linux-gnu` - ImageMagick for Linux
            
            ## Note:
            Place these files in `apps/desktop/src-tauri/binaries/` folder (no file extensions needed for Unix binaries).
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
