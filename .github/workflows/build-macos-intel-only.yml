# ═══════════════════════════════════════════════════════════════════════════
# Filoshi — macOS Intel Ghostscript Only
# Only builds the missing gs-x86_64-apple-darwin binary
# macOS ARM and Linux already work!
# ═══════════════════════════════════════════════════════════════════════════

name: Build macOS Intel Ghostscript Only

on:
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Strategy 1: Download from evermeet.cx (reliable macOS binaries)
  # ═══════════════════════════════════════════════════════════════════════════
  download-evermeet:
    runs-on: macos-13
    continue-on-error: true
    steps:
      - name: Download Ghostscript from evermeet.cx
        run: |
          # evermeet.cx provides reliable macOS binaries
          curl -L "https://evermeet.cx/ffmpeg/getrelease/gs/zip" -o ghostscript.zip || \
          curl -L "https://www.ghostscript.com/download/gsdnld.html" -s | grep -o 'https://[^"]*mac[^"]*' | head -1
          
          # Alternative: Direct download from GitHub
          curl -L "https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10040/ghostscript-10.04.0.tar.gz" -o gs.tar.gz
          tar -xzf gs.tar.gz
          cd ghostscript-10.04.0
          ./configure --prefix=/tmp/gs --disable-cups --disable-gtk --without-x --disable-shared --enable-static
          make -j$(sysctl -n hw.ncpu)
          make install
          cp /tmp/gs/bin/gs ../gs-x86_64-apple-darwin
          chmod +x ../gs-x86_64-apple-darwin

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: gs-evermeet
          path: gs-x86_64-apple-darwin

  # ═══════════════════════════════════════════════════════════════════════════
  # Strategy 2: Use Homebrew bottle directly
  # ═══════════════════════════════════════════════════════════════════════════
  download-homebrew:
    runs-on: macos-13
    continue-on-error: true
    steps:
      - name: Install and extract from Homebrew
        run: |
          # Install ghostscript
          brew install ghostscript
          
          # Copy the binary
          cp $(which gs) gs-x86_64-apple-darwin
          chmod +x gs-x86_64-apple-darwin
          
          # Verify
          ls -la gs-x86_64-apple-darwin
          ./gs-x86_64-apple-darwin --version

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: gs-homebrew
          path: gs-x86_64-apple-darwin

  # ═══════════════════════════════════════════════════════════════════════════
  # Strategy 3: Simple compile with minimal config
  # ═══════════════════════════════════════════════════════════════════════════
  compile-simple:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Simple compile
        run: |
          brew install autoconf automake libtool pkg-config
          
          cd /tmp
          curl -L "https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10040/ghostscript-10.04.0.tar.gz" -o gs.tar.gz
          tar -xzf gs.tar.gz
          cd ghostscript-10.04.0
          
          # Minimal configure
          ./configure --prefix=/tmp/gs --disable-shared --enable-static --without-x 2>&1 | tail -20
          
          # Build with single thread (more stable)
          make -j1 2>&1 | tail -50
          
          make install
          cp /tmp/gs/bin/gs $GITHUB_WORKSPACE/gs-x86_64-apple-darwin
          chmod +x $GITHUB_WORKSPACE/gs-x86_64-apple-darwin

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: gs-compiled
          path: gs-x86_64-apple-darwin

  # ═══════════════════════════════════════════════════════════════════════════
  # CREATE RELEASE
  # ═══════════════════════════════════════════════════════════════════════════
  release:
    needs: [download-evermeet, download-homebrew, compile-simple]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./binaries

      - name: Pick working binary
        run: |
          echo "=== Checking for successful builds ==="
          ls -laR ./binaries/
          
          # Try each one
          if [ -f "./binaries/gs-evermeet/gs-x86_64-apple-darwin" ]; then
            cp "./binaries/gs-evermeet/gs-x86_64-apple-darwin" ./gs-x86_64-apple-darwin
            echo "✅ Using evermeet build"
          elif [ -f "./binaries/gs-homebrew/gs-x86_64-apple-darwin" ]; then
            cp "./binaries/gs-homebrew/gs-x86_64-apple-darwin" ./gs-x86_64-apple-darwin
            echo "✅ Using homebrew build"
          elif [ -f "./binaries/gs-compiled/gs-x86_64-apple-darwin" ]; then
            cp "./binaries/gs-compiled/gs-x86_64-apple-darwin" ./gs-x86_64-apple-darwin
            echo "✅ Using compiled build"
          else
            echo "❌ No binary available"
            exit 1
          fi
          
          ls -la ./gs-x86_64-apple-darwin

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./gs-x86_64-apple-darwin
          tag_name: gs-macos-intel-${{ github.run_number }}
          name: "Ghostscript macOS Intel #${{ github.run_number }}"
          body: |
            Ghostscript binary for macOS Intel (x86_64)
            
            **File:** `gs-x86_64-apple-darwin`
            
            Place in: `apps/desktop/src-tauri/binaries/`
            
            **Note:** macOS ARM and Linux binaries are already available from previous builds.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
