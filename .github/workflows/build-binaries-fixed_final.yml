# ═══════════════════════════════════════════════════════════════════════════
# Filoshi — Missing Binary Builder
# Builds only the missing binaries: macOS (Intel & ARM) and Linux
# Windows binaries are already available
# ═══════════════════════════════════════════════════════════════════════════

name: Build Missing Binaries (macOS & Linux)

on:
  workflow_dispatch:  # Manual trigger only

env:
  GHOSTSCRIPT_VERSION: "10.04.0"
  IMAGEMAGICK_VERSION: "7.1.2-15"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # macOS INTEL - Try multiple runners (12, 13, latest)
  # Whichever starts first will build the binary
  # ═══════════════════════════════════════════════════════════════════════════
  build-macos-intel-12:
    runs-on: macos-12
    continue-on-error: true  # Don't fail if this runner hangs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install autoconf automake libtool pkg-config

      - name: Download and Build Ghostscript
        run: |
          cd /tmp
          curl -L "https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10040/ghostscript-10.04.0.tar.gz" -o gs.tar.gz
          tar -xzf gs.tar.gz
          cd ghostscript-10.04.0
          ./configure --prefix=/tmp/install --disable-cups --disable-gtk --without-x --disable-shared --enable-static
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Rename binary
        run: |
          cp /tmp/install/bin/gs gs-x86_64-apple-darwin
          chmod +x gs-x86_64-apple-darwin

      - name: Upload Ghostscript Intel (12)
        uses: actions/upload-artifact@v4
        with:
          name: gs-x86_64-apple-darwin-12
          path: gs-x86_64-apple-darwin

  build-macos-intel-13:
    runs-on: macos-13
    continue-on-error: true  # Don't fail if this runner hangs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install autoconf automake libtool pkg-config

      - name: Download and Build Ghostscript
        run: |
          cd /tmp
          curl -L "https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10040/ghostscript-10.04.0.tar.gz" -o gs.tar.gz
          tar -xzf gs.tar.gz
          cd ghostscript-10.04.0
          ./configure --prefix=/tmp/install --disable-cups --disable-gtk --without-x --disable-shared --enable-static
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Rename binary
        run: |
          cp /tmp/install/bin/gs gs-x86_64-apple-darwin
          chmod +x gs-x86_64-apple-darwin

      - name: Upload Ghostscript Intel (13)
        uses: actions/upload-artifact@v4
        with:
          name: gs-x86_64-apple-darwin-13
          path: gs-x86_64-apple-darwin

  build-macos-intel-latest:
    runs-on: macos-latest
    continue-on-error: true  # Don't fail if this runner hangs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install autoconf automake libtool pkg-config

      - name: Download and Build Ghostscript
        run: |
          cd /tmp
          curl -L "https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10040/ghostscript-10.04.0.tar.gz" -o gs.tar.gz
          tar -xzf gs.tar.gz
          cd ghostscript-10.04.0
          ./configure --prefix=/tmp/install --disable-cups --disable-gtk --without-x --disable-shared --enable-static
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Rename binary
        run: |
          cp /tmp/install/bin/gs gs-x86_64-apple-darwin
          chmod +x gs-x86_64-apple-darwin

      - name: Upload Ghostscript Intel (latest)
        uses: actions/upload-artifact@v4
        with:
          name: gs-x86_64-apple-darwin-latest
          path: gs-x86_64-apple-darwin

  # ═══════════════════════════════════════════════════════════════════════════
  # macOS ARM (Apple Silicon)
  # ═══════════════════════════════════════════════════════════════════════════
  build-macos-arm:
    runs-on: macos-14  # M1/M2 runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install autoconf automake libtool pkg-config

      - name: Download and Build Ghostscript
        run: |
          cd /tmp
          curl -L "https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10040/ghostscript-10.04.0.tar.gz" -o gs.tar.gz
          tar -xzf gs.tar.gz
          cd ghostscript-10.04.0
          ./configure --prefix=/tmp/install --disable-cups --disable-gtk --without-x --disable-shared --enable-static
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Rename binary
        run: |
          cp /tmp/install/bin/gs gs-aarch64-apple-darwin
          chmod +x gs-aarch64-apple-darwin

      - name: Upload Ghostscript ARM
        uses: actions/upload-artifact@v4
        with:
          name: gs-aarch64-apple-darwin
          path: gs-aarch64-apple-darwin

  # ═══════════════════════════════════════════════════════════════════════════
  # LINUX (x86_64)
  # ═══════════════════════════════════════════════════════════════════════════
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config \
            libtiff-dev libjpeg-dev libpng-dev libfreetype6-dev liblcms2-dev \
            libopenjp2-7-dev libxml2-dev zlib1g-dev

      - name: Build Ghostscript
        run: |
          cd /tmp
          curl -L "https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10040/ghostscript-10.04.0.tar.gz" -o gs.tar.gz
          tar -xzf gs.tar.gz
          cd ghostscript-10.04.0
          ./configure --prefix=/tmp/install --disable-cups --disable-gtk --without-x --disable-shared --enable-static
          make -j$(nproc)
          make install
          cp /tmp/install/bin/gs gs-x86_64-unknown-linux-gnu
          chmod +x gs-x86_64-unknown-linux-gnu

      - name: Build ImageMagick
        run: |
          cd /tmp
          curl -L "https://imagemagick.org/archive/releases/ImageMagick-7.1.2-15.tar.gz" -o im.tar.gz
          tar -xzf im.tar.gz
          cd ImageMagick-7.1.2-15
          ./configure --prefix=/tmp/im-install \
            --disable-shared --enable-static \
            --without-x --without-perl --without-magick-plus-plus \
            --without-fftw --without-flif --without-fpx --without-djvu \
            --without-raqm --without-wmf --without-gvc --without-openexr \
            --without-heic --without-jbig --without-lqr --without-lzma
          make -j$(nproc)
          make install
          cp /tmp/im-install/bin/magick magick-x86_64-unknown-linux-gnu
          chmod +x magick-x86_64-unknown-linux-gnu

      - name: Upload Linux Binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            gs-x86_64-unknown-linux-gnu
            magick-x86_64-unknown-linux-gnu

  # ═══════════════════════════════════════════════════════════════════════════
  # CREATE RELEASE with all available binaries
  # ═══════════════════════════════════════════════════════════════════════════
  release:
    needs: [build-macos-intel-12, build-macos-intel-13, build-macos-intel-latest, build-macos-arm, build-linux]
    runs-on: ubuntu-latest
    if: always()  # Run even if some jobs failed
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./binaries
          merge-multiple: true
        continue-on-error: true  # Don't fail if some artifacts don't exist

      - name: Pick best macOS Intel binary
        run: |
          echo "=== Checking which macOS Intel build succeeded ==="
          ls -la ./binaries/ 2>/dev/null || true
          
          # Pick the first successful Intel build
          if [ -f "./binaries/gs-x86_64-apple-darwin-12" ]; then
            cp "./binaries/gs-x86_64-apple-darwin-12" ./binaries/gs-x86_64-apple-darwin
            echo "✅ Using macos-12 Intel build"
          elif [ -f "./binaries/gs-x86_64-apple-darwin-13" ]; then
            cp "./binaries/gs-x86_64-apple-darwin-13" ./binaries/gs-x86_64-apple-darwin
            echo "✅ Using macos-13 Intel build"
          elif [ -f "./binaries/gs-x86_64-apple-darwin-latest" ]; then
            cp "./binaries/gs-x86_64-apple-darwin-latest" ./binaries/gs-x86_64-apple-darwin
            echo "✅ Using macos-latest Intel build"
          else
            echo "⚠️ No macOS Intel binary available"
          fi
          
          # Clean up temp files
          rm -f ./binaries/gs-x86_64-apple-darwin-12 ./binaries/gs-x86_64-apple-darwin-13 ./binaries/gs-x86_64-apple-darwin-latest 2>/dev/null || true
          
          echo ""
          echo "=== Final binaries for release ==="
          ls -la ./binaries/ 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./binaries/*
          tag_name: binaries-${{ github.run_number }}
          name: "Filoshi Missing Binaries #${{ github.run_number }}"
          body: |
            ## Missing Cross-Platform Binaries
            
            These are the binaries that were missing from the main Filoshi build:
            
            ### macOS (no extension)
            - `gs-x86_64-apple-darwin` - Ghostscript for Intel Macs
            - `gs-aarch64-apple-darwin` - Ghostscript for Apple Silicon (ARM)
            
            ### Linux (no extension)
            - `gs-x86_64-unknown-linux-gnu` - Ghostscript
            - `magick-x86_64-unknown-linux-gnu` - ImageMagick
            
            ### Installation:
            Place these files in:
            ```
            apps/desktop/src-tauri/binaries/
            ```
            
            **Note:** No file extensions needed for macOS and Linux binaries!
            
            ### Windows binaries:
            Windows binaries were already available and are not included in this release.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
